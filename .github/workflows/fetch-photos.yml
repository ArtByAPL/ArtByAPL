# One-off helper: downloads the original Etsy photos so they can be edited.
# Runs only on the tools/fetch-photos branch; the result is a downloadable artifact.
name: Fetch original photos
on:
  push:
    branches: [tools/fetch-photos]
    paths: [tools/photo-urls.txt, .github/workflows/fetch-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p originals
          while read -r url; do
            [ -z "$url" ] && continue
            name=$(basename "$url" | sed 's/^il_fullxfull\.//')
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "originals/$name" "$url"
          done < tools/photo-urls.txt
          ls -la originals | head -50
      - name: Commit to this temporary branch
        run: |
          mkdir -p tools/originals && mv originals/* tools/originals/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/originals
          git commit -m "Original photos (temporary, for editing)"
          git push
