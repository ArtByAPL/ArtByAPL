# One-off helper: downloads the original Etsy photos so they can be edited.
# Runs only on the tools/fetch-photos branch; the result is a downloadable artifact.
name: Fetch original photos
on:
  push:
    branches: [tools/fetch-photos]
    paths: [tools/photo-urls.txt, .github/workflows/fetch-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p stock
          : > stock/log.txt
          W=700
          while read -r name url; do
            case "$name" in ""|\#*) continue;; esac
            code=$(curl -sSL -o "stock/$name.jpg" -w '%{http_code}' "$url?w=${W:-2400}&q=85&fm=jpg")
            echo "$name $code" >> stock/log.txt
          done < tools/photo-urls.txt
          cat stock/log.txt
      - name: Commit to this temporary branch
        run: |
          mkdir -p tools/cands && mv stock/* tools/cands/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/cands
          git commit -m "Stock room photos (temporary, for mock-ups)"
          git push
